A1\u5458\u7684\u5E3D\u5FBD\u662F<b>\u91D1\u8272</b>\u7684\u3002\u5982\u679C\u5E3D\u5FBD\u4E0D\u662F\u91D1\u8272\uFF0C\u8BF7\u88C5\u7761\uFF0C<b>\u4E0D\u8981</b>\u51FA\u793A\u8F66\u7968\u3002","A real conductor wears a <b>gold</b> cap badge. If the badge is not gold, pretend to sleep and <b>do not</b> show your ticket."),q("\u591C\u91CC\u5982\u679C\u6709\u4EBA\u53EB\u4F60\u7684\u94FA\u4F4D\u53F7\uFF0C\u4E0D\u8981\u7B54\u5E94\uFF0C<b>\u4E0D\u8981\u56DE\u5934</b>\u3002","If someone calls your berth number at night, do not answer and <b>do not look back</b>."),q("\u5982\u679C\u770B\u5230\u6709\u4EBA<b>\u80CC\u5BF9\u8D70\u5ECA</b>\u7AD9\u5728\u683C\u95F4\u91CC\uFF0C\u4E0D\u8981\u4ECE\u4ED6\u8EAB\u540E\u8D70\u8FC7\u3002","If you see someone standing in a bay with their <b>back to the aisle</b>, do not walk behind them."),q("\u672C\u8F66\u4E58\u52A1\u5458\u5199\u7684\u4FBF\u6761\uFF0C\u90FD\u76D6\u6709<b>\u7EA2\u8272\u5370\u7AE0</b>\u3002","Every note written by this train\u2019s crew bears a <b>red stamp</b>.")],zx=q("\u65C5\u5BA2\u8BF7\u6CE8\u610F\uFF1A\u4E24\u70B9\u524D\u8BF7\u5230 <b>1 \u53F7\u683C\u95F4</b> \u6362\u53D6\u65B0\u8F66\u7968\uFF0C\u903E\u65F6\u8F66\u7968\u4F5C\u5E9F\u3002","Attention: please exchange your ticket at <b>Bay 1</b> before 2:00. Expired tickets will be void."),Nf=[q("\u672C\u5217\u8F66\u53EA\u6709\u4E00\u8282\u8F66\u53A2\u3002","This train has only one car."),q("\u5982\u679C\u8F66\u53A2\u91CC\u6709\u4EFB\u4F55<b>\u548C\u539F\u6765\u4E0D\u4E00\u6837</b>\u7684\u5730\u65B9\uFF0C\u8BF7\u7ACB\u523B\u6389\u5934\uFF0C\u4ECE\u4F60\u8FDB\u6765\u7684\u95E8\u56DE\u53BB\u3002","If anything in this car is <b>different from before</b>, turn around at once and go back through the door you came in."),q("\u5982\u679C\u4E00\u5207\u7167\u65E7\uFF0C\u8BF7\u8D70\u5230\u8F66\u53A2\u53E6\u4E00\u5934\uFF0C\u4ECE<b>\u524D\u95E8</b>\u79BB\u5F00\u3002","If everything is the same, walk to the other end of the car and leave through the <b>front door</b>."),q("\u95E8\u4E0A\u7684\u6570\u5B57\uFF0C\u662F\u79BB\u5929\u4EAE\u8FD8\u5269\u51E0\u8282\u8F66\u53A2\u3002\u6570\u5B57\u5F52\u96F6\uFF0C\u5929\u5C31\u4EAE\u4E86\u3002","The number on the door is how many cars are left until dawn. When it reaches zero, the sun will rise."),q("\u5982\u679C\u6709\u4EBA\u671D\u4F60\u8D70\u8FC7\u6765\uFF0C<b>\u4E0D\u8981\u7B49\u5B83\u8D70\u5230\u4F60\u9762\u524D</b>\u3002","If someone walks toward you, <b>do not wait until it reaches you</b>.")],kx={1:q("\u67E5\u7968\u7684\u65F6\u5019\uFF0C\u5343\u4E07\u522B\u7741\u773C\u3002<br>\u2014\u2014 \u4E0A\u4E00\u4E2A\u7761 7 \u53F7\u4E2D\u94FA\u7684\u4EBA","Whatever you do during the ticket check, don\u2019t open your eyes.<br>\u2014 the last person in middle berth 7"),2:q("\u5B83\u4E5F\u4F1A\u5199\u4FBF\u6761\u3002\u6CA1\u76D6\u7AE0\u7684\u90A3\u5F20\uFF0C\u4E00\u4E2A\u5B57\u90FD\u522B\u4FE1\u3002<br>\u2014\u2014 7 \u53F7\u4E2D\u94FA","It writes notes too. The one without a stamp \u2014 don\u2019t believe a word of it.<br>\u2014 middle berth 7"),3:q("\u6211\u5728\u8FD9\u8282\u8F66\u53A2\u91CC\u8D70\u4E86\u5F88\u591A\u904D\u3002<br>\u7B2C\u4E00\u904D\u7684\u65F6\u5019\uFF0C\u8BB0\u4F4F\u5B83\u539F\u6765\u7684\u6837\u5B50\u3002","I\u2019ve walked this car many, many times.<br>The first time through, remember how it looks."),4:q("\u524D\u95E8\u5916\u662F\u7AD9\u53F0\u3002\u7AD9\u53F0\u4E0A\uFF0C\u4EC0\u4E48\u90FD\u6CA1\u6709\u3002<br>\u2014\u2014 7 \u53F7\u4E2D\u94FA","Outside the front door there\u2019s a platform. There is nothing on that platform.<br>\u2014 middle berth 7")},Hx=[q("\u6211\u7B2C\u4E00\u6B21\u4E0A\u8FD9\u8D9F\u8F66\u7684\u65F6\u5019\uFF0C\u684C\u4E0A\u4E5F\u538B\u7740\u4E00\u5F20\u987B\u77E5\u3002\u80CC\u9762\u6709\u4EBA\u5199\u7740\uFF1A\u67E5\u7968\u7684\u65F6\u5019\uFF0C\u5343\u4E07\u522B\u7741\u773C\u3002","The first time I rode this train, there was a rules sheet on the table too. On the back, someone had written: whatever you do during the ticket check, don\u2019t open your eyes."),q("\u6
