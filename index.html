7\u4E0D\u8981\u9760\u8FD1\u8F66\u53A2\u5C3D\u5934\u3002","The water boiler may only be used when its lamp is <b>red</b>. If the lamp is green, stay away from the end of the car."),N("\u6253\u96F7\u65F6\u8BF7\u6570\u79D2\u3002\u5982\u679C\u95EA\u7535\u540E<b>\u4E0D\u5230 3 \u79D2</b>\u5C31\u6253\u96F7\uFF0C\u8BF7\u5728 6 \u79D2\u5185\u62C9\u4E0A\u8EAB\u8FB9\u7684\u7A97\u5E18\u3002","When it thunders, count the seconds. If thunder comes <b>less than 3 seconds</b> after the lightning, close the curtain next to you within 6 seconds."),N("\u672C\u8F66\u53A2\u9664\u4F60\u4E4B\u5916<b>\u6CA1\u6709\u5176\u4ED6\u4E58\u5BA2</b>\u3002\u5982\u679C\u4F60\u770B\u5230\u6709\u4EBA\u5750\u5728\u94FA\u4F4D\u4E0A\uFF0C\u8BF7\u4E0D\u8981\u770B\u5B83\u3002","There are <b>no other passengers</b> in this car besides you. If you see someone sitting on a berth, do not look at it."),N("\u5E7F\u64AD\u53EA\u5728\u6574\u70B9\u64AD\u62A5\u3002\u5982\u679C\u5176\u4ED6\u65F6\u95F4\u54CD\u8D77\u5E7F\u64AD\uFF0C\u5185\u5BB9\u5168\u90E8\u65E0\u6548\uFF0C\u8BF7\u4E0D\u8981\u7167\u505A\u3002","Announcements are made only on the hour. Any announcement at any other time is void. Do not follow it."),N("\u4E0D\u8981\u6361\u8D70\u9053\u4E0A\u7684\u62D6\u978B\u3002\u5982\u679C\u62D6\u978B\u7684\u978B\u5C16\u671D\u5411\u4F60\u7684\u94FA\u4F4D\uFF0C\u8BF7\u628A\u5B83\u8F6C\u8FC7\u53BB\u3002","Do not pick up slippers in the aisle. If a slipper\u2019s toe points at your berth, turn it around."),N("\u7AD9\u53F0\u4E0A\u7684\u7AD9\u540D\u724C\u4E00\u5B9A\u662F<b>\u84DD\u8272</b>\u7684\u3002\u5982\u679C\u7AD9\u540D\u724C\u662F\u7EA2\u8272\u7684\uFF0C\u4E0D\u8981\u770B\u7A97\u5916\u3002","Platform station signs are always <b>blue</b>. If a station sign is red, do not look out of the window."),N("\u7184\u706F\u540E\u5982\u679C\u542C\u5230\u53EB\u5356\u58F0\uFF0C\u8BF7\u56DE\u5230\u81EA\u5DF1\u7684\u94FA\u4F4D\u88C5\u7761\uFF0C\u4EC0\u4E48\u90FD\u4E0D\u8981\u4E70\u3002","If you hear a vendor calling after lights-out, g
