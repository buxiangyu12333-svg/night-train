A1\u5458\u7684\u5E3D\u5FBD\u662F<b>\u91D1\u8272</b>\u7684\u3002\u5982\u679C\u5E3D\u5FBD\u4E0D\u662F\u91D1\u8272\uFF0C\u8BF7\u88C5\u7761\uFF0C<b>\u4E0D\u8981</b>\u51FA\u793A\u8F66\u7968\u3002","A real conductor wears a <b>gold</b> cap badge. If the badge is not gold, pretend to sleep and <b>do not</b> show your ticket."),B("\u591C\u91CC\u5982\u679C\u6709\u4EBA\u53EB\u4F60\u7684\u94FA\u4F4D\u53F7\uFF0C\u4E0D\u8981\u7B54\u5E94\uFF0C<b>\u4E0D\u8981\u56DE\u5934</b>\u3002","If someone calls your berth number at night, do not answer and <b>do not look back</b>."),B("\u5982\u679C\u770B\u5230\u6709\u4EBA<b>\u80CC\u5BF9\u8D70\u5ECA</b>\u7AD9\u5728\u683C\u95F4\u91CC\uFF0C\u4E0D\u8981\u4ECE\u4ED6\u8EAB\u540E\u8D70\u8FC7\u3002","If you see someone standing in a bay with their <b>back to the aisle</b>, do not walk behind them."),B("\u672C\u8F66\u4E58\u52A1\u5458\u5199\u7684\u4FBF\u6761\uFF0C\u90FD\u76D6\u6709<b>\u7EA2\u8272\u5370\u7AE0</b>\u3002","Every note written by this train\u2019s crew bears a <b>red stamp</b>.")],Yx=B("\u65C5\u5BA2\u8BF7\u6CE8\u610F\uFF1A\u4E24\u70B9\u524D\u8BF7\u5230 <b>1 \u53F7\u683C\u95F4</b> \u6362\u53D6\u65B0\u8F66\u7968\uFF0C\u903E\u65F6\u8F66\u7968\u4F5C\u5E9F\u3002","Attention: please exchange your ticket at <b>Bay 1</b> before 2:00. Expired tickets will be void."),Bf=[B("\u672C\u5217\u8F66\u53EA\u6709\u4E00\u8282\u8F66\u53A2\u3002","This train has only one car."),B("\u5982\u679C\u8F66\u53A2\u91CC\u6709\u4EFB\u4F55<b>\u548C\u539F\u6765\u4E0D\u4E00\u6837</b>\u7684\u5730\u65B9\uFF0C\u8BF7\u7ACB\u523B\u6389\u5934\uFF0C\u4ECE\u4F60\u8FDB\u6765\u7684\u95E8\u56DE\u53BB\u3002","If anything in this car is <b>different from before</b>, turn around at once and go back through the door you came in."),B("\u5982\u679C\u4E00\u5207\u7167\u65E7\uFF0C\u8BF7\u8D70\u5230\u8F66\u53A2\u53E6\u4E00\u5934\uFF0C\u4ECE<b>\u524D\u95E8</b>\u79BB\u5F00\u3002","If everything is the same, walk to the other end of the car and leave through the <b>front door</b>."),B("\u95E8\u4E0A
